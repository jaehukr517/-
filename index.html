<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 미니 야구 게임</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#0b1020; color:#fff; font-family:system-ui,sans-serif; }
    #hud { position:fixed; top:12px; left:12px; background:rgba(0,0,0,.45); padding:10px 12px; border-radius:10px; line-height:1.5; z-index:10; }
    #hud b { color:#8ee6ff; }
    #msg { margin-top:6px; font-size:13px; color:#ffd27d; }
    #help { position:fixed; bottom:12px; left:12px; background:rgba(0,0,0,.35); padding:8px 10px; border-radius:10px; font-size:13px; }
    button { border:0; border-radius:8px; padding:6px 10px; background:#1e90ff; color:white; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div id="hud">
    점수: <b id="score">0</b> / 투구: <b id="pitch">0</b> / 스트라이크: <b id="strike">0</b>
    <div id="msg">스페이스바로 스윙!</div>
    <button id="reset">다시 시작</button>
  </div>
  <div id="help">조작: <b>스페이스</b> 스윙 · <b>R</b> 리셋 · 공이 플레이트 앞을 지날 때 타이밍!</div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.163.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 45, 160);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(0, 10, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x335533, 0.9);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(25, 40, 12);
    sun.castShadow = true;
    scene.add(sun);

    const field = new THREE.Mesh(
      new THREE.CircleGeometry(120, 64, Math.PI, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0x1f8a3b })
    );
    field.rotation.x = -Math.PI / 2;
    field.receiveShadow = true;
    scene.add(field);

    const dirt = new THREE.Mesh(
      new THREE.CircleGeometry(12, 40),
      new THREE.MeshStandardMaterial({ color: 0xb68655 })
    );
    dirt.rotation.x = -Math.PI / 2;
    dirt.position.y = 0.01;
    scene.add(dirt);

    const plate = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.1, 1.2),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    plate.position.set(0, 0.06, 0);
    scene.add(plate);

    const pitcher = new THREE.Mesh(
      new THREE.CylinderGeometry(0.6, 0.9, 3.2, 12),
      new THREE.MeshStandardMaterial({ color: 0x224488 })
    );
    pitcher.position.set(0, 1.6, -18);
    pitcher.castShadow = true;
    scene.add(pitcher);

    const batPivot = new THREE.Group();
    batPivot.position.set(1.2, 1.2, 1.5);
    scene.add(batPivot);

    const bat = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.2, 3.2, 14),
      new THREE.MeshStandardMaterial({ color: 0xc68642 })
    );
    bat.rotation.z = Math.PI / 2;
    bat.position.x = -1.6;
    bat.castShadow = true;
    batPivot.add(bat);

    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    ball.castShadow = true;
    scene.add(ball);

    const ui = {
      score: document.getElementById('score'),
      pitch: document.getElementById('pitch'),
      strike: document.getElementById('strike'),
      msg: document.getElementById('msg')
    };

    let score = 0, pitchCount = 0, strikes = 0;
    let swingT = 0;
    let state = 'pitching';

    const ballState = {
      pos: new THREE.Vector3(0, 1.5, -18),
      vel: new THREE.Vector3(0, 0, 0.35),
      hitVel: new THREE.Vector3(0, 0, 0),
    };

    function resetPitch() {
      ballState.pos.set((Math.random() - 0.5) * 1.0, 1.2 + Math.random() * 1.2, -18);
      ballState.vel.set((Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.005, 0.34 + Math.random() * 0.07);
      ballState.hitVel.set(0, 0, 0);
      state = 'pitching';
    }

    function resetGame() {
      score = 0; strikes = 0; pitchCount = 0;
      ui.msg.textContent = '스페이스바로 스윙!';
      updateHUD();
      resetPitch();
    }

    function updateHUD() {
      ui.score.textContent = score;
      ui.pitch.textContent = pitchCount;
      ui.strike.textContent = strikes;
    }

    function swing() {
      if (swingT > 0) return;
      swingT = 0.22;
      if (state !== 'pitching') return;

      const d = ball.position.distanceTo(new THREE.Vector3(0.7, 1.5, 0.8));
      const timing = Math.abs(ball.position.z - 0.8);

      if (d < 1.6 && timing < 1.6) {
        state = 'hit';
        const power = Math.max(0.8, 2.0 - timing * 0.75);
        ballState.hitVel.set((Math.random() - 0.5) * 0.2, 0.35 + power * 0.18, 0.9 + power * 0.6);
        score += Math.floor(10 * power);
        ui.msg.textContent = `안타! +${Math.floor(10 * power)}점`;
      } else {
        strikes++;
        ui.msg.textContent = '헛스윙!';
      }
      pitchCount++;
      updateHUD();
    }

    addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); swing(); }
      if (e.key.toLowerCase() === 'r') resetGame();
    });
    document.getElementById('reset').onclick = resetGame;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    resetPitch();

    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.033);

      if (swingT > 0) {
        swingT -= dt;
        const p = 1 - swingT / 0.22;
        batPivot.rotation.y = Math.sin(Math.min(1, p) * Math.PI) * -1.3;
      } else {
        batPivot.rotation.y += (0 - batPivot.rotation.y) * 0.18;
      }

      if (state === 'pitching') {
        ballState.pos.addScaledVector(ballState.vel, dt * 60);
        if (ballState.pos.z > 2.2) {
          if (strikes >= 2) {
            ui.msg.textContent = '삼진! R키로 재시작';
            state = 'over';
          } else {
            strikes++;
            pitchCount++;
            ui.msg.textContent = '스트라이크!';
            updateHUD();
            resetPitch();
          }
        }
      } else if (state === 'hit') {
        ballState.hitVel.y -= 0.018;
        ballState.pos.add(ballState.hitVel);
        if (ballState.pos.y <= 0.25) {
          ballState.pos.y = 0.25;
          ballState.hitVel.multiplyScalar(0.6);
          ballState.hitVel.y *= -0.3;
        }
        if (ballState.pos.length() > 180 || ballState.hitVel.length() < 0.03) {
          resetPitch();
        }
      }

      ball.position.copy(ballState.pos);
      pitcher.rotation.y = Math.sin(performance.now() * 0.002) * 0.3;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
